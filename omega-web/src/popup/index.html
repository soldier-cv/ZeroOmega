<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Z&#8203;eroOmega Popup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <ul class="om-nav">
    <li class="om-nav-item om-hidden" id="js-profile-tpl">
      <a href="#" role="button">
        <span class="glyphicon"></span>
        <span class="om-profile-name"></span>
      </a>
    </li>
    <li class="om-nav-item om-reqinfo om-hidden">
      <a href="../popup.html#!requestInfo" id="js-reqinfo" role="button">
        <span class="glyphicon glyphicon-warning-sign"></span>
        <span class="om-reqinfo-text"></span>
      </a>
    </li>
    <li class="om-section om-hidden" id="js-page-section">
      <div class="om-card om-page-card">
        <div class="om-page-head">
          <span class="glyphicon glyphicon-globe"></span>
          <span class="om-page-host-text" id="js-page-host"></span>
          <span class="om-mode" id="js-mode" role="group">
            <button type="button" class="om-mode-btn" id="js-mode-global"
              aria-pressed="true"></button>
            <button type="button" class="om-mode-btn" id="js-mode-page"
              aria-pressed="false"></button>
          </span>
        </div>
        <div class="om-scope om-hidden" id="js-scope"></div>
      </div>
    </li>
    <li class="om-section">
      <div class="om-card" id="js-profiles-card">
        <div class="om-nav-item">
          <a href="#" id="js-direct" role="button">
            <span class="glyphicon glyphicon-transfer"></span>
            <span class="om-profile-name"></span>
          </a>
        </div>
        <div class="om-nav-item">
          <a href="#" id="js-system" role="button">
            <span class="glyphicon glyphicon-off"></span>
            <span class="om-profile-name"></span>
          </a>
        </div>
        <div class="om-divider" id="js-profiles-end"></div>
        <div class="om-nav-item om-nav-addrule">
          <a href="../popup.html#!addRule" id="js-addrule" role="button">
            <span class="glyphicon glyphicon-plus"></span>
            <span id="js-addrule-label"></span>
          </a>
        </div>
      </div>
    </li>
    <li class="om-divider"></li>
    <li class="om-nav-item">
      <a href="../options.html" target="_blank" id="js-option" role="button">
        <span class="glyphicon glyphicon-wrench"></span>
        <span id="js-option-label"></span>
      </a>
    </li>
  </ul>
  <script src="../../lib/zero-dependencies/iframeResizer/iframeResizer.contentWindow.min.js"></script>
  <script src="../../lib/script.js/script.min.js"></script>
  <script src="js/loader.js"></script>
</body>
</html>
