<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Z&#8203;eroOmega Popup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="css/index.css">
</head>
<body class="om-popup">
  <ul class="om-nav" tabindex="-1">
    <li class="om-nav-item om-hidden" id="js-profile-tpl">
      <a href="#" role="button">
        <span class="glyphicon"></span>
        <span class="om-profile-name"></span>
      </a>
    </li>
    <li class="om-reqinfo om-hidden">
      <a href="../popup.html#!requestInfo" id="js-reqinfo" role="button">
        <span class="glyphicon glyphicon-warning-sign"></span>
        <span class="om-reqinfo-text"></span>
      </a>
    </li>
    <li class="om-section om-hidden" id="js-unavailable">
      <div class="om-card om-notice" id="js-unavailable-text"></div>
    </li>
    <li class="om-section" id="js-profiles-section">
      <div class="om-section-head">
        <div class="om-section-title" id="js-profiles-caption"></div>
      </div>
      <div class="om-card" id="js-profiles-card">
        <div class="om-nav-item">
          <a href="#" id="js-direct" role="button">
            <span class="glyphicon glyphicon-transfer"></span>
            <span class="om-profile-name"></span>
          </a>
        </div>
        <div class="om-nav-item">
          <a href="#" id="js-system" role="button">
            <span class="glyphicon glyphicon-off"></span>
            <span class="om-profile-name"></span>
          </a>
        </div>
        <div class="om-nav-item om-nav-addrule">
          <a href="../popup.html#!addRule" id="js-addrule" role="button">
            <span class="glyphicon glyphicon-plus"></span>
            <span id="js-addrule-label"></span>
          </a>
        </div>
      </div>
    </li>
    <li class="om-section om-hidden" id="js-link-section">
      <div class="om-card om-scope-card">
        <div class="om-scope-row">
          <span class="om-scope-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M3.5 12h17M12 3.5c2.4 2.4 3.7 5.3 3.7 8.5S14.4 18.1 12 20.5c-2.4-2.4-3.7-5.3-3.7-8.5S9.6 5.9 12 3.5z"></path>
            </svg>
          </span>
          <span class="om-scope-text">
            <span class="om-scope-label" id="js-scope-label"></span>
            <span class="om-scope-sub" id="js-scope-sub"></span>
          </span>
          <button type="button" class="om-switch" id="js-link-toggle"
            role="switch" aria-checked="false">
            <span class="om-switch-knob"></span>
          </button>
        </div>
        <div class="om-bind-area" id="js-bind-area">
          <div class="om-bind-row">
            <input type="text" id="js-link-input" class="om-bind-input">
            <button type="button" id="js-link-add" class="om-bind-btn"></button>
          </div>
          <div class="om-bind-list" id="js-link-list"></div>
        </div>
      </div>
    </li>
    <li class="om-section">
      <div class="om-card">
        <div class="om-nav-item om-option-row">
          <a href="../options.html" target="_blank" id="js-option" role="button">
            <span class="glyphicon glyphicon-wrench"></span>
            <span id="js-option-label"></span>
          </a>
        </div>
      </div>
    </li>
  </ul>
  <script src="../../lib/zero-dependencies/iframeResizer/iframeResizer.contentWindow.min.js"></script>
  <script src="../../lib/script.js/script.min.js"></script>
  <script src="js/loader.js"></script>
</body>
</html>
